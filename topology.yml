name: widnows
hosts:
  - name: trainee-workstation-01
    base_box:
      image: win10
      mgmt_user: windows
      mgmt_protocol: winrm
    flavor: standard.medium
  - name: trainee-workstation-02
    base_box:
      image: win10
      mgmt_user: windows
      mgmt_protocol: winrm
    flavor: standard.medium
routers:
  - name: rep-gateway
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.small
networks:
  - name: rep-frontend
    cidr: 10.20.20.0/24
    accessible_by_user: True
net_mappings:
  - host: trainee-workstation-01
    network: rep-frontend
    ip: 10.20.20.50
  - host: trainee-workstation-02
    network: rep-frontend
    ip: 10.20.20.60
router_mappings:
  - router: rep-gateway
    network: rep-frontend
    ip: 10.20.20.1
groups: []
