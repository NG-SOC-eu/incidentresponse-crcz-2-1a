---
- name: Force Network Profile to Private
  community.windows.win_current_user_network_profile:
    network_category: Private

- name: Enable Remote Desktop (RDP)
  ansible.windows.win_regedit:
    path: HKLM:\System\CurrentControlSet\Control\Terminal Server
    name: fDenyTSConnections
    data: 0
    type: dword

- name: Allow RDP through Firewall
  community.windows.win_firewall_rule:
    name: Remote Desktop - User Mode (TCP-In)
    enabled: yes
    state: present
    localport: 3389
    action: allow
    direction: in
    protocol: tcp

- name: Disable NLA for easier access
  ansible.windows.win_regedit:
    path: HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp
    name: UserAuthentication
    data: 0
    type: dword

- name: Enable Remote Desktop (RDP)
  ansible.windows.win_regedit:
    path: HKLM:\System\CurrentControlSet\Control\Terminal Server
    name: fDenyTSConnections
    data: 0
    type: dword

- name: Disable Network Level Authentication (NLA) for easier GUI access
  ansible.windows.win_regedit:
    path: HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp
    name: UserAuthentication
    data: 0
    type: dword

- name: Ensure Firewall allows RDP and WinRM
  ansible.windows.win_shell: |
    Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
    Enable-NetFirewallRule -DisplayGroup "Windows Remote Management"
  ignore_errors: true

