---
######### Necessary for Access
- name: Set Network Profile to Private
  ansible.windows.win_shell: |
    $Profile = Get-NetConnectionProfile
    if ($Profile.NetworkCategory -ne 'Private') {
        Set-NetConnectionProfile -NetworkCategory Private
    }
  register: profile_change
  changed_when: profile_change.stdout != ""

- name: Enable RDP & Disable NLA (Registry)
  ansible.windows.win_regedit:
    path: "{{ item.path }}"
    name: "{{ item.name }}"
    data: 0
    type: dword
  loop:
    - { path: 'HKLM:\System\CurrentControlSet\Control\Terminal Server', name: 'fDenyTSConnections' }
    - { path: 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp', name: 'UserAuthentication' }

- name: Completely Disable Firewall for Lab Environment
  community.windows.win_firewall:
    state: disabled
    profiles:
      - Domain
      - Private
      - Public

############## Necessary for not rebooting or shuting down

- name: Stop and disable wuauserv service
  ansible.windows.win_service:
    name: wuauserv
    state: stopped
    start_mode: disabled

###################### Rearm Licence. Might not work

#- name: Rearm and refresh Software Protection Service
#  ansible.windows.win_shell: |
#    slmgr.vbs /rearm
#    Start-Sleep -Seconds 5
#    Restart-Service sppsvc -Force
#  register: rearm_attempt
#  ignore_errors: yes

- name: Force Disable sppsvc via Registry
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\sppsvc
    name: Start
    data: 4
    type: dword
    state: present

- name: Disable License Shutdown Tasks (Hourly Shutdown Task - Software Protection Platform)
  ansible.windows.win_shell: |
    schtasks /change /tn "\Microsoft\Windows\Software Protection Platform\SvcRestartTask" /disable
    schtasks /change /tn "\Microsoft\Windows\Software Protection Platform\SvcRestartTaskLogon" /disable
  ignore_errors: yes

- name: Disable Automatic Reboot for Updates via Registry
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU
    name: NoAutoRebootWithLoggedOnUsers
    data: 1
    type: dword
    state: present

- name: Abort any pending shutdowns
  ansible.windows.win_shell: shutdown /a
  ignore_errors: yes

###################### Necessary for Access

- name: Enable RDP & Disable NLA (Registry)
  ansible.windows.win_regedit:
    path: "{{ item.path }}"
    name: "{{ item.name }}"
    data: 0
    type: dword
  loop:
    - { path: 'HKLM:\System\CurrentControlSet\Control\Terminal Server', name: 'fDenyTSConnections' }
    - { path: 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp', name: 'UserAuthentication' }

- name: Allow Ping (ICMP) - This fixes your "Cannot Ping" issue
  community.windows.win_firewall_rule:
    name: Allow ICMPv4-In
    protocol: icmpv4
    action: allow
    direction: in
    enabled: yes
    state: present

- name: Ensure Firewall allows RDP and WinRM
  ansible.windows.win_shell: |
    Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
    Enable-NetFirewallRule -DisplayGroup "Windows Remote Management"
  ignore_errors: true

- name: Open Firewall Ports Explicitly (WinRM & RDP)
  community.windows.win_firewall_rule:
    name: "Ansible-{{ item.name }}"
    localport: "{{ item.port }}"
    action: allow
    direction: in
    protocol: tcp
    state: present
  loop:
    - { name: 'WinRM-HTTP', port: '5985' }
    - { name: 'WinRM-HTTPS', port: '5986' }
    - { name: 'RDP', port: '3389' }

- name: Change Windows User Password
  ansible.windows.win_user:
    name: windows
    password: "qwerty!23"
    state: present
    password_never_expires: yes
    update_password: always
